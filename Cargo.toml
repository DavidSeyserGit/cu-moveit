[workspace]
members = [
  "components/bridges/repose_mujoco_sim",
  "components/libs/repose",
  "components/libs/repose_kinematics",
  "components/libs/repose_collision",
  "components/libs/repose_robot_description",
  "components/libs/repose_trajectory",
  "components/tasks/repose_joint_rrt_star",
  "components/tasks/repose_controller",
  "components/tasks/repose_io",
  "components/tasks/repose_motion_planning",
]
default-members = [
  "components/bridges/repose_mujoco_sim",
  "components/libs/repose",
  "components/libs/repose_kinematics",
  "components/libs/repose_collision",
  "components/libs/repose_robot_description",
  "components/libs/repose_trajectory",
  "components/tasks/repose_joint_rrt_star",
  "components/tasks/repose_controller",
  "components/tasks/repose_io",
  "components/tasks/repose_motion_planning",
]
resolver = "3"

[workspace.package]
version = "0.7.0"
authors = ["Lucas"]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
keywords = ["robotics", "manipulation", "kinematics", "copper", "real-time"]
categories = ["science::robotics"]
repository = "https://github.com/ReposeRobotics/repose"
# Pre-1.0: nothing is published to crates.io. Flip this one switch (and add
# versioned path dependencies, already in place) to start lockstep publishing.
publish = false

# cargo-release: one shared version for the whole workspace. It only bumps and
# commits; `just tag` tags the merged release commit. See docs/versioning.md.
[workspace.metadata.release]
shared-version = true
consolidate-commits = true
tag-name = "v{{version}}"
pre-release-commit-message = "chore: release v{{version}}"
publish = false
push = false
tag = false

[workspace.dependencies]
cu29 = { version = "1.3.1", default-features = false, features = ["units"] }
cu-spatial-payloads = { version = "1.3.0", default-features = false }
cu-rng = { version = "1.3.0", default-features = false }
bincode = { package = "cu-bincode", version = "2.2.0", default-features = false, features = [
  "derive",
  "alloc",
] }
serde = { version = "1.0", default-features = false, features = [
  "derive",
  "alloc",
] }
libm = "0.2"
