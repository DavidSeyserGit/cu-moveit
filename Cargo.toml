[workspace]
members = [
  "components/bridges/cu_mujoco_sim",
  "components/libs/cu_repose",
  "components/libs/cu_kinematics",
  "components/libs/cu_collision",
  "components/libs/cu_robot_description",
  "components/libs/cu_trajectory",
  "components/tasks/cu_joint_rrt_star",
  "components/tasks/cu_controller",
  "components/tasks/cu_io",
  "components/tasks/cu_motion_planning",
]
default-members = [
  "components/bridges/cu_mujoco_sim",
  "components/libs/cu_repose",
  "components/libs/cu_kinematics",
  "components/libs/cu_collision",
  "components/libs/cu_robot_description",
  "components/libs/cu_trajectory",
  "components/tasks/cu_joint_rrt_star",
  "components/tasks/cu_controller",
  "components/tasks/cu_io",
  "components/tasks/cu_motion_planning",
]
resolver = "3"

[workspace.package]
version = "0.6.0"
authors = ["Lucas"]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
keywords = ["robotics", "manipulation", "kinematics", "copper", "real-time"]
categories = ["science::robotics"]
repository = "https://github.com/ReposeRobotics/repose"
# Pre-1.0: nothing is published to crates.io. Flip this one switch (and add
# versioned path dependencies, already in place) to start lockstep publishing.
publish = false

[workspace.dependencies]
cu29 = { version = "1.3.1", default-features = false, features = ["units"] }
cu-spatial-payloads = { version = "1.3.0", default-features = false }
cu-rng = { version = "1.3.0", default-features = false }
bincode = { package = "cu-bincode", version = "2.2.0", default-features = false, features = [
  "derive",
  "alloc",
] }
serde = { version = "1.0", default-features = false, features = [
  "derive",
  "alloc",
] }
libm = "0.2"
