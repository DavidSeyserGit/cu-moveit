[workspace]

[package]
name = "sim-demo"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

[[bin]]
name = "sim_demo"
path = "src/main.rs"

[dependencies]
cu29 = { version = "1.3.1", default-features = false, features = ["std", "units"] }
repose-controller = { path = "../../components/tasks/repose_controller" }
repose-kinematics = { path = "../../components/libs/repose_kinematics" }
repose-trajectory = { path = "../../components/libs/repose_trajectory" }
cu-rng = "1.3.0"
repose-joint-rrt-star = { path = "../../components/tasks/repose_joint_rrt_star" }
repose-motion-planning = { path = "../../components/tasks/repose_motion_planning" }
repose-mujoco-sim = { path = "../../components/bridges/repose_mujoco_sim" }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

[build-dependencies]
cu29-build = "1.3.0"

[features]
default = ["std"]
std = [
  "cu29/std",
  "repose-controller/std",
  "repose-kinematics/std",
  "repose-trajectory/std",
  "repose-joint-rrt-star/std",
  "repose-motion-planning/std",
  "cu-rng/std",
  "repose-mujoco-sim/std",
  "serde/std",
]
