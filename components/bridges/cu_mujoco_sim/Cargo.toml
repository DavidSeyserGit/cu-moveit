[package]
name = "cu-mujoco-sim"
description = "CuBridge to an external MuJoCo simulator sidecar over TCP/JSON"
version.workspace = true
publish.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[package.metadata.copper]
kind = "bridge"
domains = ["simulation/mujoco"]
environments = ["host"]

[dependencies]
bincode = { workspace = true }
cu-controller = { version = "0.2.3", path = "../../tasks/cu_controller", default-features = false }
cu-kinematics = { version = "0.2.3", path = "../../libs/cu_kinematics", default-features = false }
cu29 = { workspace = true }
serde = { workspace = true }
serde_json = "1.0"

[features]
default = ["std"]
std = [
  "cu29/std",
  "cu-controller/std",
  "cu-kinematics/std",
  "bincode/std",
  "serde/std",
  "serde_json/std",
]
