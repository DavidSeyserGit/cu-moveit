[package]
name = "cu-repose"
description = "Repose: deterministic, real-time robot arm manipulation for copper-rs (umbrella crate)"
version.workspace = true
publish.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true
homepage = "https://getrepose.dev"
readme = "README.md"

[package.metadata.copper]
kind = "lib"
domains = ["algorithm/manipulation"]
environments = ["host", "embedded"]

[dependencies]
cu-kinematics = { version = "0.6.0", path = "../cu_kinematics", default-features = false }
cu-collision = { version = "0.6.0", path = "../cu_collision", default-features = false }
cu-robot-description = { version = "0.6.0", path = "../cu_robot_description", default-features = false }
cu-trajectory = { version = "0.6.0", path = "../cu_trajectory", default-features = false }
cu-motion-planning = { version = "0.6.0", path = "../../tasks/cu_motion_planning", default-features = false }
cu-joint-rrt-star = { version = "0.6.0", path = "../../tasks/cu_joint_rrt_star", default-features = false }
cu-controller = { version = "0.6.0", path = "../../tasks/cu_controller", default-features = false }
cu-io = { version = "0.6.0", path = "../../tasks/cu_io", default-features = false }
cu-mujoco-sim = { version = "0.6.0", path = "../../bridges/cu_mujoco_sim", default-features = false, optional = true }

[features]
default = ["std"]
std = [
  "cu-kinematics/std",
  "cu-collision/std",
  "cu-robot-description/std",
  "cu-trajectory/std",
  "cu-motion-planning/std",
  "cu-joint-rrt-star/std",
  "cu-controller/std",
  "cu-io/std",
]
# MuJoCo simulator bridge (host only).
mujoco-sim = ["std", "dep:cu-mujoco-sim", "cu-mujoco-sim/std"]
