[package]
name = "cu-robot-description"
description = "Startup URDF and SRDF import into fixed-capacity Copper serial robot models"
version.workspace = true
publish.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.copper]
kind = "lib"
domains = ["algorithm/manipulation"]
environments = ["host"]

[dependencies]
cu-kinematics = { version = "0.4.0", path = "../cu_kinematics", default-features = false }
cu-collision = { version = "0.4.0", path = "../cu_collision", default-features = false }
cu-spatial-payloads = { workspace = true }
cu29 = { workspace = true }
roxmltree = { version = "0.21", optional = true }

[dev-dependencies]
cu-joint-rrt-star = { path = "../../tasks/cu_joint_rrt_star", default-features = false }

[features]
default = ["std"]
std = ["dep:roxmltree", "cu29/std", "cu-kinematics/std", "cu-collision/std"]

[[example]]
name = "serial_robot"
required-features = ["std"]
