[package]
name = "cu-trajectory"
description = "Fixed-capacity joint trajectory payload and sampling for copper-rs"
version.workspace = true
publish.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[package.metadata.copper]
kind = "lib"
domains = ["algorithm/manipulation"]
environments = ["host", "embedded"]

[dependencies]
bincode = { workspace = true }
cu-collision = { version = "0.2.2", path = "../cu_collision", default-features = false }
cu-spatial-payloads = { workspace = true }
cu-kinematics = { version = "0.2.2", path = "../cu_kinematics", default-features = false }
cu29 = { workspace = true }
libm = { workspace = true }
serde = { workspace = true }

[features]
default = ["std"]
std = [
  "cu29/std",
  "cu-kinematics/std",
  "cu-collision/std",
  "bincode/std",
  "serde/std",
]
