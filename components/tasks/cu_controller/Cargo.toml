[package]
name = "cu-controller"
description = "Robot-agnostic unified joint controller task for copper-rs: follower setpoint + measured state in, unified joint command out"
version.workspace = true
publish.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[package.metadata.copper]
kind = "task"
domains = ["control", "manipulation"]
environments = ["host", "embedded"]

[dependencies]
bincode = { workspace = true }
cu-kinematics = { version = "0.3.0", path = "../../libs/cu_kinematics", default-features = false }
cu-trajectory = { version = "0.3.0", path = "../../libs/cu_trajectory", default-features = false }
cu29 = { workspace = true }
serde = { workspace = true }

[features]
default = ["std"]
std = [
  "cu29/std",
  "cu-kinematics/std",
  "cu-trajectory/std",
  "bincode/std",
  "serde/std",
]
