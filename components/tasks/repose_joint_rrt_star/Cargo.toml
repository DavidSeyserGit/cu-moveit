[package]
name = "repose-joint-rrt-star"
description = "Deterministic, allocation-free N-DOF joint-space RRT* anytime motion planner for copper-rs"
version.workspace = true
publish.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[package.metadata.copper]
kind = "task"
domains = ["algorithm/planning", "algorithm/manipulation"]
environments = ["host", "embedded"]

[dependencies]
bincode = { workspace = true }
repose-collision = { version = "0.6.0", path = "../../libs/repose_collision", default-features = false }
repose-kinematics = { version = "0.6.0", path = "../../libs/repose_kinematics", default-features = false }
repose-motion-planning = { version = "0.6.0", path = "../repose_motion_planning", default-features = false }
cu-rng = { workspace = true }
cu-spatial-payloads = { workspace = true }
cu29 = { workspace = true }
libm = { workspace = true }
serde = { workspace = true }

[features]
default = ["std"]
std = [
  "cu29/std",
  "repose-kinematics/std",
  "repose-collision/std",
  "repose-motion-planning/std",
  "cu-rng/std",
  "bincode/std",
  "serde/std",
]

[dev-dependencies]
ron = "0.12"
