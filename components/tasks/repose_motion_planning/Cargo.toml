[package]
name = "repose-motion-planning"
description = "Planner-agnostic joint-space motion planning contract, scene validity checking, and built-in deterministic planners for copper-rs"
version.workspace = true
publish.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
repository.workspace = true

[package.metadata.copper]
kind = "task"
domains = ["algorithm/planning", "algorithm/manipulation"]
environments = ["host", "embedded"]

[dependencies]
bincode = { workspace = true }
repose-collision = { version = "0.7.0", path = "../../libs/repose_collision", default-features = false }
repose-kinematics = { version = "0.7.0", path = "../../libs/repose_kinematics", default-features = false }
cu-rng = { workspace = true }
repose-trajectory = { version = "0.7.0", path = "../../libs/repose_trajectory", default-features = false }
cu29 = { workspace = true }
libm = { workspace = true }
serde = { workspace = true }

[features]
default = ["std"]
std = [
  "cu29/std",
  "repose-kinematics/std",
  "repose-collision/std",
  "cu-rng/std",
  "repose-trajectory/std",
  "bincode/std",
  "serde/std",
]

[dev-dependencies]
ron = "0.12"
